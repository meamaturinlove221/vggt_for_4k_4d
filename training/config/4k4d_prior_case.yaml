defaults:
  - default_dataset.yaml
  - _self_

exp_name: 4k4d_prior_case
img_size: 518
num_workers: 4
seed_value: 42
accum_steps: 1
val_epoch_freq: 1
max_img_per_gpu: 13

limit_train_batches: 100
limit_val_batches: 10

data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    shuffle: True
    pin_memory: False
    common_config:
      fix_img_num: -1
      fix_aspect_ratio: 1.0
      load_track: False
      track_num: 1024
      training: True
      inside_random: True
      img_size: ${img_size}
      patch_size: ${patch_size}
      rescale: False
      rescale_aug: False
      landscape_check: False
      debug: False
      get_nearby: False
      load_depth: True
      img_nums: [7, 13]
      max_img_per_gpu: ${max_img_per_gpu}
      allow_duplicate_img: True
      repeat_batch: False
      prior_pose_noise:
        enabled: True
        prob: 0.5
        cam_xyz_std: 0.01
        cam_xyz_global_std: 0.005
        scale_std: 0.01
        normal_std: 0.03
        visibility_dropout: 0.05
        spatial_shift_std_px: 1.0
        max_spatial_shift_px: 3
      augs:
        cojitter: False
        cojitter_ratio: 0.0
        scales: null
        aspects: [1.0, 1.0]
        color_jitter: null
        gray_scale: False
        gau_blur: False
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.dna4k4d_pseudo.DNA4K4DPseudoDataset
          split: train
          len_train: 200
          len_test: 20
          case_roots:
            - D:/vggt/vggt-main/output/training_cases/0012_11_frame0000_7views_smplxsurfacepose_v2
            - D:/vggt/vggt-main/output/training_cases/0012_11_frame0000_13views_smplxsurfacepose_v2
  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    shuffle: False
    pin_memory: False
    common_config:
      fix_img_num: -1
      fix_aspect_ratio: 1.0
      load_track: False
      track_num: 1024
      training: False
      inside_random: True
      img_size: ${img_size}
      patch_size: ${patch_size}
      rescale: False
      rescale_aug: False
      landscape_check: False
      debug: False
      get_nearby: False
      load_depth: True
      img_nums: [7, 13]
      allow_duplicate_img: True
      repeat_batch: False
      prior_pose_noise:
        enabled: False
      augs:
        cojitter: False
        cojitter_ratio: 0.0
        scales: null
        aspects: [1.0, 1.0]
        color_jitter: null
        gray_scale: False
        gau_blur: False
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.dna4k4d_pseudo.DNA4K4DPseudoDataset
          split: test
          len_train: 200
          len_test: 20
          case_roots:
            - D:/vggt/vggt-main/output/training_cases/0012_11_frame0000_7views_smplxsurfacepose_v2
            - D:/vggt/vggt-main/output/training_cases/0012_11_frame0000_13views_smplxsurfacepose_v2

logging:
  log_dir: logs
  log_visuals: False
  log_freq: 10
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
        - loss_conf_point
        - loss_reg_point
        - loss_grad_point
        - loss_human_prior
        - loss_prior_depth
        - loss_prior_depth_conf
        - loss_prior_depth_reg
        - loss_prior_depth_grad
        - loss_prior_point
        - loss_prior_point_conf
        - loss_prior_point_reg
        - loss_prior_point_grad
        - loss_prior_point_normal
        - loss_prior_point_normal_conf
        - loss_prior_point_normal_reg
        - loss_prior_point_normal_consistency
        - loss_prior_depth_normal
        - loss_prior_depth_normal_consistency
        - loss_prior_normal
        - loss_prior_normal_conf
        - loss_prior_normal_reg
        - loss_prior_normal_weight_mean
    val:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
        - loss_conf_point
        - loss_reg_point
        - loss_grad_point
        - loss_human_prior
        - loss_prior_depth
        - loss_prior_depth_conf
        - loss_prior_depth_reg
        - loss_prior_depth_grad
        - loss_prior_point
        - loss_prior_point_conf
        - loss_prior_point_reg
        - loss_prior_point_grad
        - loss_prior_point_normal
        - loss_prior_point_normal_conf
        - loss_prior_point_normal_reg
        - loss_prior_point_normal_consistency
        - loss_prior_depth_normal
        - loss_prior_depth_normal_consistency
        - loss_prior_normal
        - loss_prior_normal_conf
        - loss_prior_normal_reg
        - loss_prior_normal_weight_mean

checkpoint:
  enabled: True
  save_dir: logs/${exp_name}/ckpts
  save_freq: 1
  save_optimizer_state: False
  resume_checkpoint_path: null
  strict: False

loss:
  _target_: loss.MultitaskLoss
  camera:
    weight: 5.0
    loss_type: l1
  depth:
    weight: 1.0
    gradient_loss_fn: grad
    valid_range: 0.98
  point:
    weight: 1.0
    gradient_loss_fn: normal
    valid_range: 0.98
  human_prior:
    weight: 0.15
    depth:
      gamma: 1.0
      alpha: 0.0
      gradient_loss_fn: null
      valid_range: 0.98
    point:
      gamma: 1.0
      alpha: 0.0
      gradient_loss_fn: null
      valid_range: 0.98
    normal:
      gamma: 1.0
      alpha: 0.0
      valid_range: 0.98
      head_roi_weight: 1.5
      face_roi_weight: 2.0
      hairline_roi_weight: 2.5
      ear_band_roi_weight: 1.5
      boundary_boost: 2.0
  track: null

optim:
  param_group_modifiers: False
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-5
    weight_decay: 0.05
  frozen_module_names: []
  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["depth"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["point"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["normal"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-7
              end_value: 1e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 1e-5
              end_value: 1e-7
          lengths: [0.05, 0.95]
          interval_scaling: ["rescaled", "rescaled"]
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05

max_epochs: 5

model:
  _target_: vggt.models.vggt.VGGT
  enable_camera: True
  enable_depth: True
  enable_point: True
  enable_normal: True
  enable_track: False
  human_prior_channels: 30
  human_prior_summary_channels: 27
  human_prior_hidden_dim: 128
  human_prior_gate_init: 0.0
  human_prior_multi_scale_factors: [1, 2, 4]

distributed:
  backend: nccl
  comms_dtype: None
  find_unused_parameters: False
  timeout_mins: 60
  gradient_as_bucket_view: True
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
  cudnn_deterministic: False
  cudnn_benchmark: False
  allow_tf32: True

patch_size: 14
